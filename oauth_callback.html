<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Accesso in corso...</title>
<style>
  body { background: #080C10; color: #00FF9C; font-family: monospace;
         display: flex; align-items: center; justify-content: center;
         height: 100vh; margin: 0; font-size: 16px; }
</style>
</head>
<body>
<span>Verifica accesso...</span>
<script>
try {
  const fragment    = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = fragment.get('access_token');
  const error       = fragment.get('error');
  if (error) {
    sessionStorage.setItem('kanri_oauth_error', error);
  } else if (accessToken) {
    sessionStorage.setItem('kanri_oauth_token', accessToken);
  }
} catch(e) {
  sessionStorage.setItem('kanri_oauth_error', e.message);
}
window.location.replace('https://amebaservizi.github.io/Kanri/');
</script>
</body>
</html>
