<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login...</title></head>
<body>
<script>
// Questa pagina riceve il token OAuth2 nell'URL fragment
// e lo manda alla finestra principale tramite postMessage, poi si chiude.
try {
  const fragment = new URLSearchParams(window.location.hash.substring(1));
  const token    = fragment.get('access_token');
  const error    = fragment.get('error');
  if (window.opener) {
    window.opener.postMessage({ type: 'kanri_oauth', token, error }, 'https://amebaservizi.github.io');
  }
} catch(e) {}
window.close();
</script>
</body>
</html>
